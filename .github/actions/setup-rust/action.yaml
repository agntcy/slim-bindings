---
name: Setup Environment
description: setup environment to build/test/lint rust applications
inputs:
  toolchain:
    description: 'Rust toolchain to use'
    required: false
    default: 'stable'
  workspace:
    description: 'Cargo workspace to cache'
    required: false
    default: '.'
  cache-directories:
    description: 'Additional cache directories (whitespace-separated)'
    required: false
    default: |
      ~/.cargo/bin
      ~/.cargo/.crates.toml
      ~/.cargo/.crates2.json
  cache-enabled:
    description: 'Enable rust cache'
    required: false
    default: 'true'
  cache-key:
    description: 'Extra cache key part (e.g. the build target) jobs with a different compile workload (e.g. per target) get their own cache; leave empty to share'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      id: setup-rust
      uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      with:
        components: rustc, clippy, rustfmt
        rustflags: ''
        # Caching is handled by the Swatinem/rust-cache step below so that saving can be
        # restricted to the default branch (setup-rust-toolchain does not expose save-if).
        cache: false

    # Every ref restores (PRs, merge queue, releases); only pushes to main save. Caches saved by
    # main are readable from any ref, while a PR-scoped cache is never visible to main or tags,
    # so a PR cannot poison release builds.
    - name: Setup Rust cache
      if: inputs.cache-enabled == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: ${{ inputs.workspace }}
        cache-on-failure: false
        shared-key: ${{runner.os}}-${{runner.arch}}-${{inputs.cache-key}}-rust-${{hashFiles('**/Cargo.lock')}}
        cache-all-crates: true
        cache-bin: false # cache-bin has a bug at the swatinem cache level, if it's enabled, it will cause the bin cache to be cleared
        cache-directories: ${{ inputs.cache-directories }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup Taskfile
      uses: ./.github/actions/setup-task

    - name: Install C/C++ toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        curl -L https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 19
        sudo apt-get install -y \
          pkg-config \
          make \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          gcc-x86-64-linux-gnu \
          g++-x86-64-linux-gnu
