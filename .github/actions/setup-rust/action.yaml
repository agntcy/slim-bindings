---
name: Setup Environment
description: setup environment to build/test/lint rust applications
inputs:
  toolchain:
    description: 'Rust toolchain to use'
    required: false
    default: 'stable'
  workspace:
    description: 'Cargo workspace to cache'
    required: false
    default: '.'
  cache-directories:
    description: 'Additional cache directories (whitespace-separated)'
    required: false
    default: |
      .tools
  cache-enabled:
    description: 'Enable rust cache'
    required: false
    default: 'true'
  cache-key:
    description: 'Extra cache key part (e.g. the build target) jobs with a different compile workload (e.g. per target) get their own cache; leave empty to share'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      id: setup-rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        components: rustc, clippy, rustfmt
        rustflags: ''
        cache: ${{ inputs.cache-enabled }}
        cache-workspaces: ${{ inputs.workspace }}
        cache-on-failure: false
        cache-shared-key: ${{runner.os}}-${{runner.arch}}-${{inputs.cache-key}}-rust
        cache-all-crates: true
        # Caches binaries installed with cargo install during the job (uniffi bindgens, cargo-zigbuild, ...)
        cache-bin: true
        cache-directories: ${{ inputs.cache-directories }}
        # Every ref restores (PRs, merge queue, releases); only pushes to main save. Caches saved
        # by main are readable from any ref, while a PR-scoped cache is never visible to main or
        # tags, so a PR cannot poison release builds.
        cache-save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup Taskfile
      uses: ./.github/actions/setup-task

    - name: Install C/C++ toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        curl -L https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
        chmod +x /tmp/llvm.sh
        sudo /tmp/llvm.sh 19
        sudo apt-get install -y \
          pkg-config \
          make \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          gcc-x86-64-linux-gnu \
          g++-x86-64-linux-gnu
