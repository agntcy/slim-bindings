---
name: Setup Environment
description: setup environment to build/test/lint rust applications
inputs:
  toolchain:
    description: 'Rust toolchain to use'
    required: false
    default: 'stable'
  workspace:
    description: 'Cargo workspace to cache'
    required: false
    default: '.'
  cache-enabled:
    description: 'Enable the caches (Rust target directory and installed tools)'
    required: false
    default: 'true'
  cache-target:
    description: 'Cache the cargo registry and the target directory. Jobs that do not compile much can turn it off and keep the (small) tools cache, which only depends on cache-enabled'
    required: false
    default: 'true'
  cache-key:
    description: 'Extra cache key part (e.g. the build target) jobs with a different compile workload (e.g. per target) get their own cache; leave empty to share'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      id: setup-rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: rustc, clippy, rustfmt
        rustflags: ''
        # v2 defaults to deny; keep the previous behaviour (warnings do not fail builds).
        build-warnings: warn
        cache: ${{ inputs.cache-enabled == 'true' && inputs.cache-target == 'true' }}
        cache-workspaces: ${{ inputs.workspace }}
        cache-on-failure: false
        # A cache entry is written once and never updated: while the key is unchanged, a run that
        # restores it saves nothing. The key only follows Cargo.lock, the manifests and rustc, so
        # when the layout of rust/target changes (for example a new target directory such as
        # rust/target/wheels-zig), append a version suffix here (-v2, -v3, ...); otherwise the new
        # files are never saved.
        cache-shared-key: ${{runner.os}}-${{runner.arch}}-${{ inputs.cache-key || github.job }}-rust
        cache-all-crates: true
        # Installed tools get their own cache below (keyed on what pins their versions).
        cache-bin: false
        # Every ref restores (PRs, merge queue, releases); only pushes to main save. Caches saved
        # by main are readable from any ref, while a PR-scoped cache is never visible to main or
        # tags, so a PR cannot poison release builds.
        cache-save-if: ${{ github.ref == 'refs/heads/main' }}

    # Installed tools: cargo install'ed binaries (uniffi bindgens, cargo-zigbuild, slimrpc plugins),
    # the compiled uniffi-bindgen-react-native CLI (~/.cache/ubrn, see tasks/ubrn.yaml) and .tools
    # (buf, protoc, zig, minisign). Keyed on the files that pin their versions, so a
    # version bump refreshes it independently of the Rust cache. A miss restores the newest older
    # entry and the install tasks (status checks) only reinstall what changed. The runner image
    # version is part of the key because ~/.cargo/bin also holds the rustup proxies, which must
    # match the image. The job id and cache-key are part of the key because an entry is saved once:
    # without them the first job to finish (e.g. a lint job with no tools installed) would own the
    # entry and every other job would restore it empty. Every ref restores, only pushes to main save.
    - name: Compute tools cache key
      id: tools-key
      if: inputs.cache-enabled == 'true'
      shell: bash
      run: |
        # ImageVersion is set by GitHub-hosted runners; read it from the process env, which the
        # `env` expression context does not expose.
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore tools cache
      if: inputs.cache-enabled == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cache/ubrn
          .tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.image }}-${{ github.job }}-${{ inputs.cache-key }}-${{ hashFiles('**/Taskfile.yaml', 'tasks/*.yaml', 'slimrpc-compiler/**') }}
        restore-keys: |
          tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.image }}-${{ github.job }}-${{ inputs.cache-key }}-

    - name: Restore and save tools cache
      if: inputs.cache-enabled == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cache/ubrn
          .tools
        key: tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.image }}-${{ github.job }}-${{ inputs.cache-key }}-${{ hashFiles('**/Taskfile.yaml', 'tasks/*.yaml', 'slimrpc-compiler/**') }}
        restore-keys: |
          tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools-key.outputs.image }}-${{ github.job }}-${{ inputs.cache-key }}-

    - name: Setup Taskfile
      uses: ./.github/actions/setup-task

    - name: Configure LLVM apt repository
      if: runner.os == 'Linux'
      shell: bash
      run: |
        . /etc/os-release
        codename="${UBUNTU_CODENAME:-${VERSION_CODENAME:-}}"
        if [[ -z "${codename}" ]]; then
          echo "::error::Unable to determine the Linux distribution codename"
          exit 1
        fi

        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" \
          | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list > /dev/null
        sudo apt-get update

    # The package list is cached (and restored without downloading); bump `version` when it changes.
    - name: Install cached C/C++ toolchain
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: >-
          clang-19
          lldb-19
          lld-19
          clangd-19
          pkg-config
          make
          gcc-aarch64-linux-gnu
          g++-aarch64-linux-gnu
          gcc-x86-64-linux-gnu
          g++-x86-64-linux-gnu
        version: llvm19-v1
        execute_install_scripts: "true"
