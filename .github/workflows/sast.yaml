---
name: SAST

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly deep scan, independent of code changes.
    - cron: '30 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # CodeQL: covers the languages CodeQL has stable support for in this repo.
  # Rust is not analyzed here - see the clippy job below instead.
  # ==========================================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            # The Kotlin sources depend on UniFFI-generated bindings that are
            # produced by a separate multi-stage build (compile the Rust
            # cdylib, run uniffi-bindgen, patch the output) which autobuild
            # can't reproduce, so it fails compiling the Kotlin examples.
            # Extract sources without compiling, like csharp below.
            build-mode: none
          - language: csharp
            build-mode: none
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # ==========================================================================
  # Rust static analysis via cargo clippy (CodeQL's Rust support is not yet
  # stable enough to rely on here).
  # ==========================================================================
  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rust
            workspace: rust
            # The "web" and "rpc" features of agntcy-slim-bindings-ffi are
            # mutually exclusive (rpc depends on a runtime that "web" compiles
            # out), so they cannot both be active in the same build. Lint the
            # default feature set (rpc) here and "web" separately below,
            # instead of using --all-features.
            args: --all-targets
          - name: rust (web)
            workspace: rust
            args: --all-targets --no-default-features --features web
          - name: slimrpc-compiler
            workspace: slimrpc-compiler
            args: --all-targets --all-features
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./${{ matrix.workspace }}

      - name: Run cargo clippy
        working-directory: ./${{ matrix.workspace }}
        run: cargo clippy ${{ matrix.args }} -- -D warnings
