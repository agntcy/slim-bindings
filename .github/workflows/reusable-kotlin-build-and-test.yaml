---
name: reusable-kotlin-build-and-test
on:
  workflow_call:
    inputs:
      runner:
        description: Github hosted runner or Self hosted runner
        required: false
        type: string
        default: ubuntu-latest
      rust-workspace:
        description: Rust workspace directory
        required: false
        type: string
        default: ./rust
      java-version:
        description: Java version to use
        required: false
        type: string
        default: '21'
      working-directory:
        description: The working directory to run the task
        required: false
        type: string
        default: ./kotlin
      matrix:
        description: JSON platform matrix (from generate-matrix), used to restore per-target library artifacts
        required: false
        type: string
        default: ''

jobs:
  kotlin-bindings-build-and-test:
    name: Kotlin Bindings Build and Test
    runs-on: ${{ inputs.runner }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ${{ inputs.rust-workspace }}
          cache-enabled: false

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: ${{ inputs.java-version }}

      # Download all library artifacts and restore to target folder structure
      - name: Download library artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ github.workspace }}/target-artifacts/
          pattern: bindings-*

      - name: Restore libraries to target folder
        env:
          MATRIX_JSON: ${{ inputs.matrix }}
        run: |
          echo "📦 Restoring artifacts to target folder..."
          for target in $(echo "$MATRIX_JSON" | jq -r '.platform[] | select(.exclude != true) | .target'); do
            mkdir -p "$GITHUB_WORKSPACE/rust/target/$target/release/"
            # download-artifact only nests under path/<artifact-name>/ when the
            # pattern matches more than one artifact; with exactly one match
            # (e.g. the reduced PR matrix) it extracts flat into the download
            # path instead (actions/download-artifact v5+ behavior).
            src_dir="$GITHUB_WORKSPACE/target-artifacts/bindings-$target"
            [ -d "$src_dir" ] || src_dir="$GITHUB_WORKSPACE/target-artifacts"
            find "$src_dir" -maxdepth 1 -type f -exec cp {} "$GITHUB_WORKSPACE/rust/target/$target/release/" \;
            echo "  Restored $target"
          done
          echo "📁 Restored libraries:"
          find "$GITHUB_WORKSPACE/rust/target" -name "*slim_bindings*" -type f | sort
          rm -rf "$GITHUB_WORKSPACE/target-artifacts"

      # Regenerate slimrpc stubs, build bindings + examples (incl. slimrpc), run tests.
      # Mirrors the dotnet reusable workflow (generate-proto -> build -> test) so a break
      # in the slimrpc plugin, the core API, or the example is caught in CI.
      # slimrpc:generate-proto installs protoc-gen-slimrpc-kotlin via `cargo install` into
      # ~/.cargo/bin, which is already on PATH (rustup default) for buf's
      # `local: protoc-gen-slimrpc-kotlin` to resolve.
      # No git-diff freshness check here: the kotlin buf.gen.yaml uses unpinned remote
      # protobuf plugins, so a committed-stub diff could fail spuriously when they change
      # upstream (the java workflow, whose plugin is version-pinned, does check).
      - name: Generate slimrpc stubs, build and test
        run: |
          echo "Generating slimrpc proto stubs..."
          task slimrpc:generate-proto

          echo "Building bindings and compiling examples (incl. slimrpc)..."
          task build PROFILE=release

          echo "Running bindings tests..."
          task test PROFILE=release

      - name: Strip native libraries
        uses: ./.github/actions/strip-libraries
        with:
          path: ${{ inputs.working-directory }}/generated/jniLibs

      - name: Upload generated Kotlin code and JNI libraries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kotlin-bindings-generated-code
          path: |
            ${{ inputs.working-directory }}/generated/**/*.kt
            ${{ inputs.working-directory }}/generated/jniLibs/**/*
          if-no-files-found: error
