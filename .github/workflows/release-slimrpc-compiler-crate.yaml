---
name: ci-release-slimrpc-compiler-crate

on:
  push:
    paths:
      - 'slimrpc-compiler/**'
    branches:
      - main

permissions:
  contents: read

jobs:
  release-crate:
    name: Release slimrpc-compiler crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./slimrpc-compiler
      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          manifest_path: ./slimrpc-compiler/Cargo.toml
          config: ./slimrpc-compiler/.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-crate-pr:
    name: Release slimrpc-compiler crate - PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-slimrpc-compiler-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./slimrpc-compiler
      - name: Run release-plz - PR
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          manifest_path: ./slimrpc-compiler/Cargo.toml
          config: ./slimrpc-compiler/.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
