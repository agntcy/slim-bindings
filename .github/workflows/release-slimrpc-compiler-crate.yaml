---
name: ci-release-slimrpc-compiler-crate

on:
  push:
    paths:
      - 'slimrpc-compiler/**'
    branches:
      - main

permissions:
  contents: read

jobs:
  release-crate:
    name: Release slimrpc-compiler crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./slimrpc-compiler
      - name: Run release-plz
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
          manifest_path: ./slimrpc-compiler/Cargo.toml
          config: ./slimrpc-compiler/.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-crate-pr:
    name: Release slimrpc-compiler crate - PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-slimrpc-compiler-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Authenticate as the GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./slimrpc-compiler
      - name: Run release-plz - PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
          manifest_path: ./slimrpc-compiler/Cargo.toml
          config: ./slimrpc-compiler/.release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
