---
name: reusable-java-build-and-test
on:
  workflow_call:
    inputs:
      rust-cache:
        description: Enable the Rust build cache (restored on every ref, saved only on main)
        required: false
        type: boolean
        default: true
      runner:
        description: Github hosted runner or Self hosted runner
        required: false
        type: string
        default: ubuntu-latest
      rust-workspace:
        description: Rust workspace directory
        required: false
        type: string
        default: ./rust
      java-version:
        description: Java version to use
        required: false
        type: string
        default: '21'
      working-directory:
        description: The working directory to run the task
        required: false
        type: string
        default: ./java

permissions:
  contents: read

jobs:
  java-bindings-build-and-test:
    name: Java Bindings Build and Test
    runs-on: ${{ inputs.runner }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ${{ inputs.rust-workspace }}
          cache-enabled: ${{ inputs.rust-cache }}
          # Only bindgen tools are installed here (the tools cache covers them); the library is not compiled.
          cache-target: false

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: ${{ inputs.java-version }}

      # Download all library artifacts and restore to target folder structure
      - name: Download library artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Everything except the iOS libraries. Not bindings-*: download-artifact extracts a single
          # match without a subdirectory, which the restore step below relies on.
          pattern: '!rn-*'
          path: ${{ github.workspace }}/target-artifacts/

      - name: Restore libraries to target folder
        run: |
          echo "📦 Restoring artifacts to target folder..."
          for artifact_dir in "$GITHUB_WORKSPACE/target-artifacts/bindings-"*; do
            [ -d "$artifact_dir" ] || continue
            target=$(basename "$artifact_dir" | sed 's/^bindings-//')
            mkdir -p "$GITHUB_WORKSPACE/rust/target/$target/release/"
            find "$artifact_dir" -maxdepth 1 -type f -exec cp {} "$GITHUB_WORKSPACE/rust/target/$target/release/" \;
            echo "  Restored $target"
          done
          echo "📁 Restored libraries:"
          find "$GITHUB_WORKSPACE/rust/target" -name "*slim_bindings*" -type f | sort
          rm -rf "$GITHUB_WORKSPACE/target-artifacts"

      # Regenerate slimrpc stubs, build bindings + examples (incl. slimrpc), run tests.
      # Mirrors the dotnet reusable workflow (generate-proto -> build -> test) so a break
      # in the slimrpc plugin, the core API, or the example is caught in CI.
      # slimrpc:generate-proto installs protoc-gen-slimrpc-java via `cargo install` into
      # ~/.cargo/bin, which is already on PATH (rustup default) for buf's
      # `local: protoc-gen-slimrpc-java` to resolve.
      - name: Generate slimrpc stubs, build and test
        run: |
          echo "Generating slimrpc proto stubs..."
          task slimrpc:generate-proto

          # Assert the committed generated stubs match a fresh generation.
          # `git add -N` makes any newly generated (untracked) files visible to
          # `git diff` (buf.gen.yaml uses clean: true, so the dirs are fully regenerated).
          echo "Verifying committed slimrpc stubs are up to date..."
          git add -N examples/slimrpc/simple/slimrpc examples/slimrpc/simple/types
          if ! git diff --exit-code -- examples/slimrpc/simple/slimrpc examples/slimrpc/simple/types; then
            echo "::error::Committed slimrpc stubs are out of date. Run 'task slimrpc:generate-proto' in java/ and commit the result." >&2
            exit 1
          fi

          echo "Building bindings and compiling examples (incl. slimrpc)..."
          task build PROFILE=release

          echo "Running bindings tests..."
          task test PROFILE=release

      - name: Strip native libraries
        uses: ./.github/actions/strip-libraries
        with:
          path: ${{ inputs.working-directory }}/generated/native

      - name: Upload generated Java code and native libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-bindings-generated-code
          path: |
            ${{ inputs.working-directory }}/generated/uniffi/**/*.java
            ${{ inputs.working-directory }}/generated/native/**/*
          if-no-files-found: error
