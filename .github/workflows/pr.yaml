---
name: ci-test-and-build-bindings

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bindings-build-and-test:
    name: Bindings - build & test
    uses: ./.github/workflows/reusable-bindings-build-and-test.yaml

  success:
    name: Success
    if: ${{ always() }}
    needs:
      - bindings-build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the build and test job succeeded
        if: ${{ needs.bindings-build-and-test.result != 'success' }}
        env:
          RESULT: ${{ needs.bindings-build-and-test.result }}
        run: |
          echo "::error::Bindings build and test did not succeed: ${RESULT}"
          exit 1
