# TEMP: debug the React Native `ubrn generate` step. Delete before merging.
name: tmp-ubrn-debug

on:
  pull_request:
    paths:
      - .github/workflows/tmp-ubrn-debug.yaml

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust
          cache-enabled: false

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the iOS simulator library built by an earlier run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rn-ios-aarch64-apple-ios-sim
          path: ${{ github.workspace }}/rn-ios
          run-id: 39141159197
          github-token: ${{ github.token }}

      - name: Restore the library
        run: |
          mkdir -p rust/target/aarch64-apple-ios-sim/release
          cp rn-ios/libslim_bindings.a rust/target/aarch64-apple-ios-sim/release/
          ls -la rust/target/aarch64-apple-ios-sim/release

      - name: Install ubrn
        working-directory: ./react-native
        run: |
          task install-uniffi-bindgen-react-native
          which ubrn
          npm ls -g --depth=0 | head -5

      - name: Run `task generate` with a logging shim in front of ubrn
        working-directory: ./react-native
        run: |
          REAL="$(which ubrn)"
          mkdir -p /tmp/shim
          cat > /tmp/shim/ubrn <<SHIM
          #!/usr/bin/env bash
          echo "SHIM cwd=\$(pwd)" >&2
          echo "SHIM args=\$*" >&2
          for a in "\$@"; do
            case "\$a" in
              /*|../*) echo "SHIM path arg: \$a  exists=\$([ -e "\$a" ] && echo yes || echo NO)" >&2 ;;
            esac
          done
          exec "$REAL" "\$@"
          SHIM
          chmod +x /tmp/shim/ubrn
          set +e
          PATH="/tmp/shim:$PATH" task generate TARGET=aarch64-apple-ios-sim 2>&1 | grep -E "SHIM|Error:|Generating|Using prebuilt" | cut -c1-300
          echo "task generate exit code: ${PIPESTATUS[0]}"
