---
name: ci-release-bindings

on:
  push:
    tags:
      - 'slim-bindings-*'

permissions:
  contents: read

env:
  LIBRARY_NAME: slim_bindings
  GO_BINDINGS_REPO: agntcy/slim-bindings-go
  NUGET_PACKAGE_NAME: Agntcy.Slim
  # NordSecurity tag: bindgen targets UniFFI v0.31.x (metadata matches workspace 0.31.1)
  UNIFFI_BINDGEN_GO_VERSION: v0.7.1+v0.31.0
  # NordSecurity tag: bindgen targets UniFFI v0.31.x (upstream release incl. the 0.31 upgrade PR #163)
  UNIFFI_BINDGEN_CS_VERSION: v0.11.0+v0.31.0
  DOTNET_VERSION: "8.0.x"

jobs:
  # ==========================================================================
  # Job 1: Build and test bindings libraries for all languages and platforms
  # ==========================================================================
  build-and-test-bindings:
    name: "Build and Test Bindings"
    uses: ./.github/workflows/reusable-bindings-build-and-test.yaml
    with:
      tag-name: ${{ github.ref_name }}

  # ==========================================================================
  # Job 2: Create GitHub release with library artifacts (for test tags)
  # ==========================================================================
  release-libraries:
    name: Release Libraries
    runs-on: ubuntu-latest
    needs: build-and-test-bindings
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Download all library artifacts from build-libraries job
      - name: Download all library artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts/
          pattern: bindings-*

      - name: List downloaded artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          find ./artifacts -type f -ls

      - name: Strip native libraries
        uses: ./.github/actions/strip-libraries
        with:
          path: ./artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p ./release-artifacts

          # The download-artifact action already organizes files by artifact name
          # Each platform's libraries are in ./artifacts/bindings-<target>/
          # We'll zip each platform's libraries separately

          for platform_dir in "./artifacts/bindings-"*/; do
            if [ -d "$platform_dir" ]; then
              platform_name=$(basename "$platform_dir" | sed 's/^bindings-//')
              echo "📦 Preparing libraries for platform: $platform_name"

              # Rename libraries to platform-specific names expected by consumers (e.g. Go cgo directives)
              TARGET="$platform_name"
              ARCH=$(echo "$TARGET" | cut -d'-' -f1)
              OS=$(echo "$TARGET" | cut -d'-' -f3)
              ABI=$(echo "$TARGET" | cut -d'-' -f4)

              if [ -n "$ABI" ] && [ "$ABI" != "" ]; then
                LIB_NAME="${LIBRARY_NAME}_${ARCH}_${OS}_${ABI}"
              else
                LIB_NAME="${LIBRARY_NAME}_${ARCH}_${OS}"
              fi

              for file in "$platform_dir"/lib"${LIBRARY_NAME}"* "$platform_dir"/"${LIBRARY_NAME}".*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  new_filename="${filename/${LIBRARY_NAME}/${LIB_NAME}}"
                  if [ "$filename" != "$new_filename" ]; then
                    mv "$file" "$platform_dir/$new_filename"
                    echo "   Renamed: $filename -> $new_filename"
                  fi
                fi
              done

              cd "$platform_dir"
              zip -r "../../release-artifacts/slim-bindings-${platform_name}.zip" .
              cd - > /dev/null

              echo "✅ Created slim-bindings-${platform_name}.zip"
            fi
          done

          echo "📋 Release artifacts:"
          ls -lah ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: "${{ github.ref_name }}"
          body: |
            Release of SLIM native bindings libraries.

            **Platforms included:**
            - Linux x86_64 (GNU and musl)
            - Linux aarch64 (GNU and musl)
            - macOS x86_64 (Intel)
            - macOS aarch64 (Apple Silicon)
            - Windows x86_64 (GNU and MSVC)
            - Windows aarch64 (MSVC)

            Built from commit: ${{ github.sha }}
          files: ./release-artifacts/*.zip
          draft: false

  # ==========================================================================
  # Job 3: Generate and publish Go bindings
  # ==========================================================================
  release-go-bindings:
    name: "Release Go Bindings"
    needs: [build-and-test-bindings, release-libraries]
    uses: ./.github/workflows/reusable-go-bindings-release.yaml
    secrets:
      gh-token: ${{ secrets.AGNTCY_BUILD_BOT_GH_TOKEN }}

  # ==========================================================================
  # Job 4: Release Python bindings to PyPI
  # ==========================================================================
  release-python-bindings:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-and-test-bindings
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist
          pattern: wheels-*

      - name: Show files
        run: ls -l dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist

  # ==========================================================================
  # Job 5: Release .NET bindings to NuGet
  # ==========================================================================
  release-dotnet-bindings:
    name: "Release .NET Bindings"
    needs: build-and-test-bindings
    uses: ./.github/workflows/reusable-dotnet-bindings-release.yaml
    secrets:
      nuget-api-token: ${{ secrets.NUGET_API_TOKEN }}

  # ==========================================================================
  # Job 6: Generate Node bindings once (x86_64 Linux) for use by all pack jobs.
  # uniffi-bindgen-react-native's napi generator must dlopen the compiled library
  # on the host to introspect it; we only have a native lib for the runner, so we
  # generate once then pack per target with each target's own lib (--lib-colocated
  # output resolves the library at runtime relative to the JS file, so the same
  # generated JS is valid for every target).
  # ==========================================================================
  generate-node-bindings-once:
    name: Generate Node bindings (once)
    runs-on: ubuntu-latest
    needs:
      - build-and-test-bindings
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          # Release workflow: disable GHA npm cache (zizmor cache-poisoning / trusted tag builds only).
          package-manager-cache: false

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Download library artifact (x86_64 Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: Place library for Node generate
        run: |
          RELEASE_DIR="rust/target/x86_64-unknown-linux-gnu/release"
          mkdir -p "$RELEASE_DIR"
          if [ -n "$(find "$RELEASE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "Library files (from artifact path):"
            find "$RELEASE_DIR" -maxdepth 1 ! -path "$RELEASE_DIR" -ls
            exit 0
          fi
          find . -type f \( -name 'libslim_bindings*.so' -o -name 'slim_bindings*.so' \) -exec cp -v {} "$RELEASE_DIR/" \; 2>/dev/null
          [ -n "$(find "$RELEASE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ] || { echo "No library files found."; find . -maxdepth 4 -ls 2>/dev/null | head -80; exit 1; }
          echo "Library files (copied):"
          find "$RELEASE_DIR" -maxdepth 1 ! -path "$RELEASE_DIR" -ls

      - name: Generate Node bindings
        working-directory: ./node
        run: |
          npm install
          task generate TARGET=x86_64-unknown-linux-gnu

      - name: Upload generated bindings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: node-generated-bindings
          path: ./node/generated/

  # ==========================================================================
  # Job 7: Build Node platform packages (matrix: one per target with .so/.dylib/.dll).
  # Uses pre-generated bindings + each target's library (no re-running the napi
  # generator against non-native libs it can't dlopen on this host).
  # win32-x64-gnu excluded: same os/cpu as win32-x64-msvc, so npm cannot tell them
  # apart and both would install on Windows x64 (see node/scripts/platform-id.ts).
  # ==========================================================================
  build-node-packages:
    name: Node ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - build-and-test-bindings
      - generate-node-bindings-once
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-unknown-linux-gnu
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get bindings version
        id: version
        run: echo "version=$(bash .github/scripts/get-binding-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Download generated bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-generated-bindings
          path: ./node/generated/

      # Into its own directory, NOT the workspace root: the previous `path: .`
      # combined with a repo-wide `find` below also matched the x86_64-gnu library
      # that ships inside node-generated-bindings (node/generated/libslim_bindings.so).
      # Both have the same basename, so that copy landed second and overwrote this
      # target's library - every linux package except x86_64-gnu shipped the gnu x64
      # library (2.1.0 and 2.1.1: linux-arm64-gnu, linux-x64-musl, linux-arm64-musl).
      - name: Download library artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: ./target-lib

      - name: Place library for Node pack
        run: |
          RELEASE_DIR="rust/target/${{ matrix.target }}/release"
          mkdir -p "$RELEASE_DIR"
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            *-apple-darwin)               PATTERN='*.dylib' ;;
            *-linux-gnu|*-linux-musl)     PATTERN='*.so' ;;
            *-windows-msvc|*-windows-gnu) PATTERN='*.dll' ;;
            *)                            PATTERN='*slim_bindings*' ;;
          esac
          # Only ever from the artifact for THIS target.
          find ./target-lib -type f -name "$PATTERN" -exec cp -v {} "$RELEASE_DIR/" \;
          if [ -z "$(find "$RELEASE_DIR" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "::error::No $PATTERN found in the bindings-$TARGET artifact."
            find ./target-lib -maxdepth 3 -ls 2>/dev/null | head -40
            exit 1
          fi
          echo "Library files (copied):"
          find "$RELEASE_DIR" -maxdepth 1 ! -path "$RELEASE_DIR" -ls

      # The packed library must actually match the target. Nothing verified this
      # before, so a wrong-ABI/wrong-arch library shipped silently: consumers only
      # find out at dlopen time, and no CI job loads these packages.
      - name: Verify library matches target
        run: |
          TARGET="${{ matrix.target }}"
          RELEASE_DIR="rust/target/$TARGET/release"
          case "$TARGET" in
            x86_64-unknown-linux-gnu)   lib=libslim_bindings.so; want_arch=x86-64;  want_libc=glibc ;;
            aarch64-unknown-linux-gnu)  lib=libslim_bindings.so; want_arch=aarch64; want_libc=glibc ;;
            x86_64-unknown-linux-musl)  lib=libslim_bindings.so; want_arch=x86-64;  want_libc=musl ;;
            aarch64-unknown-linux-musl) lib=libslim_bindings.so; want_arch=aarch64; want_libc=musl ;;
            *-apple-darwin|*-windows-*)
              echo "Non-ELF target $TARGET; readelf checks not applicable."
              exit 0
              ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac

          got_arch=$(readelf -h "$RELEASE_DIR/$lib" | awk -F: '/Machine/{gsub(/^ +/,"",$2); print $2}')
          case "$got_arch" in
            *X86-64*)  arch=x86-64 ;;
            *AArch64*) arch=aarch64 ;;
            *)         arch="unknown ($got_arch)" ;;
          esac

          # musl links libc.so; glibc links libc.so.6 / ld-linux-*
          needed=$(readelf -d "$RELEASE_DIR/$lib" | grep -oE '\[libc[^]]*\]|\[ld-linux[^]]*\]' | tr -d '[]' | tr '\n' ' ')
          case "$needed" in
            *libc.so.6*|*ld-linux*) libc=glibc ;;
            *libc.so*)              libc=musl ;;
            *)                      libc="unknown ($needed)" ;;
          esac

          echo "$TARGET -> arch=$arch libc=$libc (NEEDED: $needed)"
          if [ "$arch" != "$want_arch" ] || [ "$libc" != "$want_libc" ]; then
            echo "::error::$lib for $TARGET is arch=$arch libc=$libc, expected arch=$want_arch libc=$want_libc."
            exit 1
          fi

      - name: Strip native libraries
        uses: ./.github/actions/strip-libraries
        with:
          path: rust/target/${{ matrix.target }}/release
          max-depth: '1'

      - name: Pack Node platform package
        working-directory: ./node
        run: |
          npm install
          task pack:platform:from-artifacts TARGET=${{ matrix.target }} VERSION=${{ steps.version.outputs.version }}

      - name: Upload Node platform package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: node-platform-${{ matrix.target }}
          path: ./node/dist/node-*.tgz

  # ==========================================================================
  # Job 8: Publish Node platform packages to npm
  # ==========================================================================
  publish-node-platform-packages:
    name: Publish Node platform packages
    runs-on: ubuntu-latest
    needs: build-node-packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all Node platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./node-packages
          pattern: node-platform-*

      # Trusted publishing requires npm >= 11.5.1 (Node 22.14 ships npm 10.x).
      - name: Setup Node (npm OIDC)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#slim-bindings-}"; VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-* ]]; then NPM_TAG="${VERSION#*-}"; NPM_TAG="${NPM_TAG%%.*}"; NPM_TAG="${NPM_TAG:-next}"; else NPM_TAG="latest"; fi
          echo "Publishing platform packages with dist-tag: $NPM_TAG"
          for tgz in ./node-packages/node-platform-*/*.tgz; do
            [ -f "$tgz" ] || continue
            echo "Publishing $tgz..."
            npm publish "$tgz" --access public --tag "$NPM_TAG"
          done

  # ==========================================================================
  # Job 9: Publish Node main package to npm
  # Uses pre-generated bindings from generate-node-bindings-once; only emits types and publishes.
  # ==========================================================================
  publish-node-main:
    name: Publish Node main package
    runs-on: ubuntu-latest
    needs:
      - publish-node-platform-packages
      - generate-node-bindings-once
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get bindings version
        id: version
        run: echo "version=$(bash .github/scripts/get-binding-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Node (npm OIDC)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Download generated bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-generated-bindings
          path: ./node/generated/

      - name: Emit types and prepare package
        working-directory: ./node
        run: |
          npm install
          task emit-types

      - name: Set version in package.json
        working-directory: ./node
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="${BINDINGS_VERSION}"
          node -e "
            const pkg = require('./package.json');
            const v = process.env.BINDINGS_VERSION;
            const opt = pkg.optionalDependencies || {};
            for (const k of Object.keys(opt)) opt[k] = v;
            pkg.optionalDependencies = opt;
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # Every optionalDependency must have been published by the preceding job.
      # A name listed here but never built leaves consumers on that platform with
      # no binary at all (the linux-*-musl entries were in this state for several
      # releases), so fail the release instead of shipping a broken matrix.
      - name: Verify platform packages are published
        working-directory: ./node
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          missing=()
          for pkg in $(node -p "Object.keys(require('./package.json').optionalDependencies).join(' ')"); do
            found=""
            for attempt in 1 2 3; do
              if npm view "${pkg}@${BINDINGS_VERSION}" version >/dev/null 2>&1; then
                found="yes"
                break
              fi
              sleep 10
            done
            if [ -n "$found" ]; then
              echo "  ✅ ${pkg}@${BINDINGS_VERSION}"
            else
              echo "  ❌ ${pkg}@${BINDINGS_VERSION} is not on the registry"
              missing+=("$pkg")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Refusing to publish: optionalDependencies missing from the registry: ${missing[*]}"
            echo "Either add the target to build-node-packages or drop it from node/package.json."
            exit 1
          fi

      - name: Publish main package to npm
        working-directory: ./node
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$BINDINGS_VERSION" == *-* ]]; then NPM_TAG="${BINDINGS_VERSION#*-}"; NPM_TAG="${NPM_TAG%%.*}"; NPM_TAG="${NPM_TAG:-next}"; else NPM_TAG="latest"; fi
          echo "Publishing with dist-tag: $NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"

  # ==========================================================================
  # Job 10: Build and publish React Native bindings to npm
  # Runs on mac to build iOS static lib; publishes via npm trusted publishing (OIDC).
  # ==========================================================================
  publish-react-native:
    name: Publish React Native to npm
    runs-on: macos-15
    needs:
      - build-and-test-bindings
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get bindings version
        id: version
        run: echo "version=$(bash .github/scripts/get-binding-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup Node (npm OIDC)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install cargo-binstall (prebuilt binary)
        # Install the prebuilt cargo-binstall so the build task's
        # `install-cargo-binstall` step (status-guarded on `cargo binstall`)
        # skips compiling it from source. The source build pulls in aws-lc-sys,
        # whose build script panics in CcBuilder::memcmp_check on the macOS CI
        # runner, which broke the iOS static-lib build.
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Build iOS static libs (device + simulator)
        id: build-ios
        working-directory: ./react-native
        env:
          # Required for ___chkstk_darwin: aws-lc-sys and linker need iOS 13.4+
          IPHONEOS_DEPLOYMENT_TARGET: "13.4"
          # Force linker wrapper via absolute path (Task's TASKFILE_DIR can differ on CI)
          CARGO_TARGET_AARCH64_APPLE_IOS_LINKER: "${{ github.workspace }}/rust/.cargo/clang-ios-linker-wrapper.sh"
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER: "${{ github.workspace }}/rust/.cargo/clang-ios-linker-wrapper.sh"
        run: |
          chmod +x "${{ github.workspace }}/rust/.cargo/clang-ios-linker-wrapper.sh"
          rm -f /tmp/linker-args.log
          _sim_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          BINDGEN_EXTRA_CLANG_ARGS="-isysroot ${_sim_sdk} -target arm64-apple-ios15.0-simulator"
          export BINDGEN_EXTRA_CLANG_ARGS
          task adapter:bindings:build:all TARGET=aarch64-apple-ios-sim PROFILE=release
          _ios_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          BINDGEN_EXTRA_CLANG_ARGS="-isysroot ${_ios_sdk} -target arm64-apple-ios15.0"
          export BINDGEN_EXTRA_CLANG_ARGS
          task adapter:bindings:build:all TARGET=aarch64-apple-ios PROFILE=release

      - name: Vendor iOS libs and create XCFramework
        working-directory: ./react-native
        run: |
          task vendor:ios
          task xcframework:ios

      - name: Generate React Native bindings
        working-directory: ./react-native
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_LINKER: "${{ github.workspace }}/rust/.cargo/clang-ios-linker-wrapper.sh"
          IPHONEOS_DEPLOYMENT_TARGET: "13.4"
        run: |
          _sim_sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          BINDGEN_EXTRA_CLANG_ARGS="-isysroot ${_sim_sdk} -target arm64-apple-ios15.0-simulator"
          export BINDGEN_EXTRA_CLANG_ARGS
          task generate TARGET=aarch64-apple-ios-sim

      - name: Generate browser/WASM bindings
        working-directory: ./react-native
        run: |
          rustup target add wasm32-unknown-unknown
          task generate:web

      - name: Verify WASM artifacts for npm publish
        working-directory: ./react-native
        run: |
          test -f web.ts
          test -f generated/web/wasm-bindgen/index_bg.wasm
          test -s generated/web/wasm-bindgen/index_bg.wasm
          test -f generated/web/wasm-bindgen/index.js
          npm pack --dry-run 2>&1 | grep -q index_bg.wasm

      - name: Set version in package.json
        working-directory: ./react-native
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="${BINDINGS_VERSION}"

      - name: Publish to npm
        working-directory: ./react-native
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$BINDINGS_VERSION" == *-* ]]; then NPM_TAG="${BINDINGS_VERSION#*-}"; NPM_TAG="${NPM_TAG%%.*}"; NPM_TAG="${NPM_TAG:-next}"; else NPM_TAG="latest"; fi
          echo "Publishing with dist-tag: $NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"

  # ==========================================================================
  # Job 6b: Release Kotlin bindings to GitHub Packages
  # ==========================================================================
  release-kotlin-bindings:
    name: "Release Kotlin Bindings"
    needs: build-and-test-bindings
    uses: ./.github/workflows/reusable-kotlin-bindings-release.yaml
    permissions:
      contents: read
      packages: write
    secrets:
      MVN_TOKEN_NAME: ${{ secrets.MVN_TOKEN_NAME }}
      MVN_TOKEN_PASSWORD: ${{ secrets.MVN_TOKEN_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # ==========================================================================
  # Job 7: Release Java bindings to GitHub Packages and Maven Central
  # ==========================================================================
  release-java-bindings:
    name: "Release Java Bindings"
    needs: build-and-test-bindings
    uses: ./.github/workflows/reusable-java-bindings-release.yaml
    permissions:
      contents: read
      packages: write
    secrets:
      MVN_TOKEN_NAME: ${{ secrets.MVN_TOKEN_NAME }}
      MVN_TOKEN_PASSWORD: ${{ secrets.MVN_TOKEN_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
