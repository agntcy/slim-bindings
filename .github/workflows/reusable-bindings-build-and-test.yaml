---
name: reusable-bindings-build-and-test
on:
  workflow_call:
    inputs:
      rust-cache:
        description: Enable the Rust build cache (restored on every ref, saved only on main)
        required: false
        type: boolean
        default: true
      runner:
        description: Github hosted runner or Self hosted runner
        required: false
        type: string
        default: ubuntu-latest
      tag-name:
        description: Git tag name for version extraction (e.g., slim-bindings-1.2.3)
        required: false
        type: string
        default: ""
      rust-workspace:
        description: Rust workspace directory for caching
        required: false
        type: string
        default: ./rust
      library-output-dir:
        description: Directory where the compiled library will be located
        required: false
        type: string
        default: ./rust/target/release
      library-name:
        description: Name of the compiled library (without lib prefix and extension)
        required: false
        type: string
        default: slim_bindings
      uniffi-bindgen-go-version:
        description: Version tag for uniffi-bindgen-go
        required: false
        type: string
        default: v0.7.1+v0.31.0
      build-ios:
        description: Build the iOS static libraries and package the React Native tarball (release tags)
        required: false
        type: boolean
        default: false
    outputs:
      react-native-version:
        description: Version set in the React Native package (empty unless build-ios is true)
        value: ${{ jobs.react-native-package.outputs.version }}
env:
  LIBRARY_NAME: slim_bindings
  PYTHON_VERSION: '3.11'
  AWS_LC_SYS_CMAKE_BUILDER: '0'

permissions:
  contents: read

jobs:
  generate-matrix:
    name: Generate Platform Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix-no-windows-gnu: ${{ steps.set-matrix.outputs.matrix-no-windows-gnu }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          # Define the complete platform matrix
          MATRIX=$(cat <<'MATRIX_EOF'
          {
            "platform": [
              {
                "runner": "ubuntu-24.04",
                "os": "linux",
                "target": "x86_64-unknown-linux-musl",
                "python-platform": "musllinux_1_2_x86_64",
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "ubuntu-24.04",
                "os": "linux",
                "target": "x86_64-unknown-linux-gnu",
                "python-platform": "manylinux_2_28_x86_64",
                "exclude": false
              },
              {
                "runner": "windows-11-arm",
                "os": "windows",
                "target": "aarch64-pc-windows-msvc",
                "python-platform": "win_arm64",
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "ubuntu-24.04",
                "os": "linux",
                "target": "aarch64-unknown-linux-musl",
                "python-platform": "musllinux_1_2_aarch64",
                "use_qemu": true,
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "ubuntu-24.04",
                "os": "linux",
                "target": "aarch64-unknown-linux-gnu",
                "python-platform": "manylinux_2_28_aarch64",
                "use_qemu": true,
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "windows-latest",
                "os": "windows",
                "target": "x86_64-pc-windows-msvc",
                "python-platform": "win_amd64",
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "ubuntu-24.04",
                "os": "linux",
                "target": "x86_64-pc-windows-gnu",
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "macos-15-intel",
                "build-runner": "macos-15",
                "os": "macos",
                "target": "x86_64-apple-darwin",
                "python-platform": "macosx_10_12_x86_64",
                "exclude": ${{ github.event_name == 'pull_request' }}
              },
              {
                "runner": "macos-15",
                "os": "macos",
                "target": "aarch64-apple-darwin",
                "python-platform": "macosx_11_0_arm64",
                "exclude": ${{ github.event_name == 'pull_request' }}
              }
            ],
            "exclude": [
              {
                "platform": {
                  "exclude": true
                }
              }
            ]
          }
          MATRIX_EOF
          )

          # Output full matrix for build job
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

          # Create filtered matrix (exclude windows-gnu for Python tests)
          MATRIX_NO_WIN_GNU=$(echo "$MATRIX" | jq -c '{platform: [.platform[] | select(.target != "x86_64-pc-windows-gnu")], exclude: .exclude}')
          echo "matrix-no-windows-gnu=$(echo "$MATRIX_NO_WIN_GNU" | jq -c .)" >> "$GITHUB_OUTPUT"

  build-libraries:
    needs: generate-matrix
    name: "${{ matrix.platform.target }}"
    # `build-runner` lets a target cross-compile on a faster runner: the Intel
    # macOS runner took over an hour, so x86_64-apple-darwin builds on Apple
    # Silicon. Jobs that run the binaries keep using `runner`.
    runs-on: ${{ matrix.platform.build-runner || matrix.platform.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ./rust
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust
          # x86_64-pc-windows-gnu is consumed by nothing on main: Python skips it, .NET excludes it
          # and it ships no cdylib package. Only the Go release (tags) uses it, which can build it
          # cold. Do not spend part of the 10 GB cache limit on it.
          cache-enabled: ${{ inputs.rust-cache && !contains(matrix.platform.target, 'windows-gnu') }}
          cache-key: ${{ matrix.platform.target }}
      - name: Build library
        working-directory: ./rust
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
        run: |
          task bindings:build:all TARGET="$PLATFORM_TARGET" PROFILE=release
      - name: Normalize cargo output path
        run: |
          # zigbuild uses a versioned target dir (e.g. .2.28) for linux-gnu; native
          # build with --target uses the unversioned path. Move libs to the
          # unversioned path the rest of the workflow expects.
          TARGET="${{ matrix.platform.target }}"
          if [[ "$TARGET" == *"-linux-gnu" ]] && [ -d "target/${TARGET}.2.28/release" ]; then
            mkdir -p "target/${TARGET}/release"
            mv "target/${TARGET}.2.28/release"/*slim_bindings* "target/${TARGET}/release/"
          fi
          echo "📁 Library files:"
          ls -lah target/${{ matrix.platform.target }}/release/*slim_bindings*
        working-directory: ./rust
      # The cdylib - not the static archive - is what every downstream package
      # ships (Node platform packages, .NET runtimes/, Python wheels). musl
      # produced only libslim_bindings.a for several releases without failing
      # anything here, because the listing above is satisfied by the archive.
      # windows-gnu is not asserted: it ships no cdylib-based package today.
      - name: Verify shared library was produced
        working-directory: ./rust
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
        run: |
          case "$PLATFORM_TARGET" in
            *-apple-darwin) expected="libslim_bindings.dylib" ;;
            *-linux-gnu|*-linux-musl) expected="libslim_bindings.so" ;;
            *-windows-msvc) expected="slim_bindings.dll" ;;
            *)
              echo "No cdylib expectation for $PLATFORM_TARGET; skipping."
              exit 0
              ;;
          esac
          release_dir="target/$PLATFORM_TARGET/release"
          if [ ! -f "$release_dir/$expected" ]; then
            echo "::error::$expected was not produced for $PLATFORM_TARGET."
            echo "Downstream packages ship the shared library, not the static archive."
            echo "Files present in $release_dir:"
            ls -lah "$release_dir" | grep slim_bindings || true
            exit 1
          fi
          echo "✅ $release_dir/$expected ($(du -h "$release_dir/$expected" | cut -f1))"
      - name: Upload libs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bindings-${{ matrix.platform.target }}
          path: ./rust/target/${{ matrix.platform.target }}/release/*slim_bindings*
      - name: Install uv
        if: "!contains(matrix.platform.target, 'windows-gnu')"
        uses: ./.github/actions/setup-python
        with:
          uv-install: 'true'
      - name: Generate python wheels
        if: "!contains(matrix.platform.target, 'windows-gnu')"
        working-directory: ./python
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
        run: task python:bindings:packaging TARGET="$PLATFORM_TARGET" PROFILE=release
      - name: Upload wheels
        if: "!contains(matrix.platform.target, 'windows-gnu')"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.platform.target }}
          path: ./python/dist

  go-bindings-build-and-test:
    runs-on: ${{ inputs.runner }}
    needs:
      - generate-matrix
      - build-libraries

    defaults:
      run:
        shell: bash
        working-directory: ./go

    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ${{ inputs.rust-workspace }}
          cache-enabled: ${{ inputs.rust-cache }}
          # Only the bindgen tool is installed here (the tools cache covers it); the library is not compiled.
          cache-target: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      # Download all library artifacts and restore to target folder structure
      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: ${{ github.workspace }}/target-artifacts/

      - name: Restore libraries to target folder
        run: |
          echo "📦 Restoring artifacts to target folder..."
          for artifact_dir in "$GITHUB_WORKSPACE/target-artifacts/bindings-"*; do
            [ -d "$artifact_dir" ] || continue
            target=$(basename "$artifact_dir" | sed 's/^bindings-//')
            mkdir -p "$GITHUB_WORKSPACE/rust/target/$target/release/"
            find "$artifact_dir" -maxdepth 1 -type f -exec cp {} "$GITHUB_WORKSPACE/rust/target/$target/release/" \;
            echo "  Restored $target"
          done
          echo "📁 Restored libraries:"
          find "$GITHUB_WORKSPACE/rust/target" -name "*slim_bindings*" -type f | sort
          rm -rf "$GITHUB_WORKSPACE/target-artifacts"

      - name: Generate Go bindings
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          # Extract version from tag name if present (e.g., slim-bindings-v1.3.0 -> v1.3.0)
          VERSION="$TAG_NAME"
          VERSION="${VERSION#slim-bindings-}"
          VERSION="${VERSION:-devel}"

          task generate PROFILE=release VERSION="$VERSION"

          echo "📁 slim-bindings-go files:"
          find ./slim_bindings -type f

      - name: Make sure generation did not modify source files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Generated Go bindings differ from committed files. Please commit the updated bindings."
            git status
            git --no-pager diff
            exit 1
          else
            echo "✅ Generated Go bindings are up-to-date with committed files."
          fi

      - name: Run Go bindings tests
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          # Extract version from tag name if present (e.g., slim-bindings-v1.3.0 -> v1.3.0)
          VERSION="$TAG_NAME"
          VERSION="${VERSION#slim-bindings-}"
          VERSION="${VERSION:-devel}"

          echo "Running Go bindings tests..."
          task test PROFILE=release VERSION="$VERSION"

      - name: Upload Generated Go code
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: go-bindings-generated-code
          path: |
            ./go/slim_bindings
            !./go/slim_bindings/*.a
            !./go/slim_bindings/*.so
            !./go/slim_bindings/*.dylib
            !./go/slim_bindings/*.dll
            !./go/slim_bindings/*.lib
          if-no-files-found: error

  python-bindings-test:
    name: Test Python Wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    needs:
      - generate-matrix
      - build-libraries
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix-no-windows-gnu) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup QEMU for ARM64 emulation
        if: matrix.platform.use_qemu == true
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64

      - name: Setup Python (Windows/macOS only)
        if: matrix.platform.os != 'linux'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-${{ matrix.platform.target }}
          path: ./wheels/
          merge-multiple: true

      - name: List downloaded wheels
        run: |
          echo "📦 Downloaded wheels:"
          find ./wheels -type f -name "*.whl" -ls || echo "No wheels found"

      - name: Test wheel installation and usage (Linux with container)
        if: matrix.platform.os == 'linux'
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
          PYTHON_PLATFORM: ${{ matrix.platform.python-platform }}
        run: |
          echo "📦 Testing Python wheel"
          echo "🖥️  Platform: $PLATFORM_TARGET"

          # Determine platform for container selection
          if [[ "$PLATFORM_TARGET" == *"aarch64"* ]]; then
            PLATFORM="linux/arm64"
            echo "🔧 Using ARM64 platform"
          else
            PLATFORM="linux/amd64"
            echo "🔧 Using AMD64 platform"
          fi

          # Determine libc variant for container selection
          if [[ "$PLATFORM_TARGET" == *"musl"* ]]; then
            CONTAINER_IMAGE="python:$PYTHON_VERSION-alpine"
          else
            CONTAINER_IMAGE="python:$PYTHON_VERSION-slim"
          fi

          # Run test in container
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$(pwd)/wheels:/wheels" \
            -v "$(pwd):/repo:ro" \
            -w /workspace \
            -e "PYTHON_PLATFORM=$PYTHON_PLATFORM" \
            -e "PLATFORM_TARGET=$PLATFORM_TARGET" \
            "$CONTAINER_IMAGE" \
            sh -c '
              # Exit on the first failure: without it a failing test.py is ignored and the
              # step reports success from the final echo.
              set -e
              TEST_DIR=$(mktemp -d)
              cd "$TEST_DIR"
              echo "📂 Testing in: $TEST_DIR"

              WHEEL=$(find /wheels -name "*${PYTHON_PLATFORM}*.whl" | head -1)
              if [ -z "$WHEEL" ]; then
                echo "❌ No wheel found for platform $PYTHON_PLATFORM"
                exit 1
              fi

              echo "📦 Installing wheel: $WHEEL"
              pip install "$WHEEL"
              echo "✅ Wheel installed successfully"

              python /repo/.github/tests/python/test_installation.py

              echo ""
              echo "🎉 All tests passed on $PLATFORM_TARGET!"
            '

      - name: Test wheel installation and usage (Windows/macOS)
        if: matrix.platform.os != 'linux'
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
          PLATFORM_RUNNER: ${{ matrix.platform.runner }}
          PYTHON_PLATFORM: ${{ matrix.platform.python-platform }}
        run: |
          echo "📦 Testing Python wheel"
          echo "🖥️  Platform: $PLATFORM_TARGET"
          echo "🏃 Runner: $PLATFORM_RUNNER"
          echo "📂 Testing in current directory"

          # Find and install the wheel for this platform
          WHEEL=$(find ./wheels -name "*${PYTHON_PLATFORM}*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "❌ No wheel found for platform $PYTHON_PLATFORM"
            echo "Available wheels:"
            find ./wheels -name "*.whl"
            exit 1
          fi

          echo "📦 Installing wheel: $WHEEL"
          pip install "$WHEEL"
          echo "✅ Wheel installed successfully"

          # Run installation test
          python ./.github/tests/python/test_installation.py

          echo ""
          echo "🎉 All tests passed on $PLATFORM_TARGET!"

      - name: Test result summary
        if: success()
        env:
          PLATFORM_TARGET: ${{ matrix.platform.target }}
        run: |
          echo "✅ Python wheel verification completed successfully on $PLATFORM_TARGET"
          echo "The wheel can be safely published."

  react-native-wasm-build:
    name: Build React Native browser/WASM bindings
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./react-native
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Generate browser/WASM bindings
        run: |
          rustup target add wasm32-unknown-unknown
          task generate:web

      - name: Verify WASM artifacts
        run: |
          test -f web.ts
          test -f generated/web/wasm-bindgen/index_bg.wasm
          test -s generated/web/wasm-bindgen/index_bg.wasm
          test -f generated/web/wasm-bindgen/index.js
          npm pack --dry-run 2>&1 | grep -q index_bg.wasm

      - name: Upload browser/WASM bindings
        if: ${{ inputs.build-ios }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: react-native-web
          path: react-native/generated/web
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # iOS static libraries for the React Native package. Built in parallel with the
  # rest of the matrix and packaged by react-native-package, instead of building
  # everything in one serial macOS job. Only needed for releases (build-ios).
  # ==========================================================================
  build-ios-libraries:
    if: ${{ inputs.build-ios }}
    name: "iOS ${{ matrix.target }}"
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: ./rust
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust
          # Release-only job: tags do not save caches and nothing else restores these entries.
          cache-enabled: false
      - name: Install cargo-binstall (prebuilt binary)
        # Install the prebuilt cargo-binstall so the build task's `install-cargo-binstall` step
        # (status-guarded on `cargo binstall`) skips compiling it from source. The source build
        # pulls in aws-lc-sys, whose build script panics in CcBuilder::memcmp_check on the macOS
        # CI runner, which broke the iOS static-lib build.
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Build library
        env:
          PLATFORM_TARGET: ${{ matrix.target }}
        run: task bindings:build:all TARGET="$PLATFORM_TARGET" PROFILE=release
      - name: Verify static library was produced
        env:
          PLATFORM_TARGET: ${{ matrix.target }}
        run: |
          lib="target/$PLATFORM_TARGET/release/libslim_bindings.a"
          if [ ! -f "$lib" ]; then
            echo "::error::$lib was not produced for $PLATFORM_TARGET."
            ls -lah "target/$PLATFORM_TARGET/release" | grep slim_bindings || true
            exit 1
          fi
          echo "✅ $lib ($(du -h "$lib" | cut -f1))"
      - name: Upload iOS library
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rn-ios-${{ matrix.target }}
          path: ./rust/target/${{ matrix.target }}/release/libslim_bindings.a
          if-no-files-found: error
          retention-days: 1

      # uniffi-bindgen-react-native compiles its CLI from source on first use (1-3 minutes). Do it
      # here, in parallel with the other legs, so react-native-package does not wait for it: only
      # the device leg (it finishes before the simulator one), and the binary is passed on as an
      # artifact. The version is the project's devDependency, the same one the package job installs.
      - name: Setup Node (ubrn build)
        if: ${{ matrix.target == 'aarch64-apple-ios' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile uniffi-bindgen-react-native
        if: ${{ matrix.target == 'aarch64-apple-ios' }}
        working-directory: .
        run: |
          VERSION=$(node -p "require('./react-native/package.json').dependencies['uniffi-bindgen-react-native']")
          npm install -g "uniffi-bindgen-react-native@${VERSION}"
          # The launcher runs `cargo run`, which compiles the CLI on first use.
          ubrn --help > /dev/null
          BIN="$(npm root -g)/uniffi-bindgen-react-native/target/debug/uniffi-bindgen-react-native"
          test -x "$BIN"
          mkdir -p "$RUNNER_TEMP/ubrn"
          cp "$BIN" "$RUNNER_TEMP/ubrn/"
          ls -lah "$RUNNER_TEMP/ubrn"
      - name: Upload uniffi-bindgen-react-native
        if: ${{ matrix.target == 'aarch64-apple-ios' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rn-ubrn
          path: ${{ runner.temp }}/ubrn/uniffi-bindgen-react-native
          if-no-files-found: error
          retention-days: 1

  # Packages the React Native tarball from the iOS libraries and the browser/WASM
  # bindings built above. Runs on macOS only for xcodebuild (XCFramework); nothing
  # is compiled here.
  react-native-package:
    if: ${{ inputs.build-ios }}
    name: Package React Native
    needs:
      - build-ios-libraries
      - react-native-wasm-build
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get bindings version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=$(bash .github/scripts/get-binding-version.sh)" >> "$GITHUB_OUTPUT"
          else
            # Not a release: only used to exercise the packaging in pull requests.
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust
          cache-enabled: false

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download iOS libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rn-ios-*
          path: ${{ github.workspace }}/rn-ios/

      - name: Restore iOS libraries to target folder
        run: |
          for dir in "$GITHUB_WORKSPACE/rn-ios/rn-ios-"*; do
            [ -d "$dir" ] || continue
            target=$(basename "$dir" | sed 's/^rn-ios-//')
            mkdir -p "$GITHUB_WORKSPACE/rust/target/$target/release"
            cp "$dir/libslim_bindings.a" "$GITHUB_WORKSPACE/rust/target/$target/release/"
            echo "  restored $target"
          done

      - name: Download browser/WASM bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-native-web
          path: ${{ github.workspace }}/react-native/generated/web

      - name: Vendor iOS libs and create XCFramework
        working-directory: ./react-native
        run: |
          task vendor:ios
          task xcframework:ios

      - name: Download prebuilt uniffi-bindgen-react-native
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rn-ubrn
          path: ${{ github.workspace }}/ubrn-prebuilt

      - name: Generate React Native bindings
        working-directory: ./react-native
        env:
          # tasks/ubrn.yaml points the ubrn launcher at this binary instead of compiling the CLI.
          UBRN_BINARY: ${{ github.workspace }}/ubrn-prebuilt/uniffi-bindgen-react-native
        run: |
          chmod +x "$UBRN_BINARY"
          task generate TARGET=aarch64-apple-ios-sim

      - name: Verify WASM artifacts for npm publish
        working-directory: ./react-native
        run: |
          test -f web.ts
          test -f generated/web/wasm-bindgen/index_bg.wasm
          test -s generated/web/wasm-bindgen/index_bg.wasm
          test -f generated/web/wasm-bindgen/index.js
          npm pack --dry-run 2>&1 | grep -q index_bg.wasm

      - name: Set version in package.json
        working-directory: ./react-native
        env:
          BINDINGS_VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="${BINDINGS_VERSION}"

      # package.json has no pack/publish lifecycle scripts, so this tarball is
      # exactly what `npm publish` would upload from the directory.
      - name: Pack React Native package
        working-directory: ./react-native
        run: |
          mkdir -p ../rn-package
          npm pack --pack-destination ../rn-package
          ls -lah ../rn-package

      - name: Upload React Native package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: react-native-package
          path: rn-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  node-bindings-test:
    name: Test Node.js Bindings
    runs-on: ubuntu-24.04
    needs:
      - build-libraries
    defaults:
      run:
        shell: bash
        working-directory: ./node
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./rust
          # The library is downloaded from the build job, not compiled here.
          cache-target: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-x86_64-unknown-linux-gnu
          path: ./rust/target/x86_64-unknown-linux-gnu/release/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          find ../rust/target/x86_64-unknown-linux-gnu/release/ -type f -ls

      - name: Generate Node.js bindings
        run: |
          task generate TARGET=x86_64-unknown-linux-gnu

      # Guard the main package's named-export barrel: it must stay in sync with
      # the generated bindings surface so `import { Channel } from
      # '@agntcy/slim-bindings'` (and slimrpc-generated stubs) keep resolving.
      - name: Check named-export barrel
        # CWD is ./node (job default working-directory), so the node dir is ".".
        run: node "${GITHUB_WORKSPACE}/.github/tests/node/check_named_exports.mjs" .

      # Prove the slimrpc node target end-to-end: generate stubs from the
      # in-repo plugin, type-check the generated example, then run it against a
      # live in-process SLIM broker so a break in the generator, the runtime
      # bindings, or the example is caught here (not just at type-check time).
      - name: Generate slimrpc stubs (node example)
        run: task generate-proto

      - name: Install generated bindings deps
        working-directory: ./node/generated
        run: npm install

      - name: Install slimrpc example deps
        working-directory: ./node/examples/slimrpc/simple
        run: npm install

      - name: Type-check slimrpc example
        working-directory: ./node/examples/slimrpc/simple
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run slimrpc example end-to-end (broker round-trip)
        run: bash "${GITHUB_WORKSPACE}/.github/tests/node/slimrpc_e2e.sh" examples/slimrpc/simple

  dotnet-bindings-build-and-test:
    name: "Dotnet Bindings Build and Test"
    permissions:
      contents: read
    needs:
      - generate-matrix
      - build-libraries
    uses: ./.github/workflows/reusable-dotnet-build-and-test.yaml
    with:
      runner: ${{ inputs.runner }}
      rust-workspace: ${{ inputs.rust-workspace }}
      rust-cache: ${{ inputs.rust-cache }}
      rust-target: x86_64-unknown-linux-gnu
      tag-name: ${{ inputs.tag-name }}

  kotlin-bindings-build-and-test:
    name: "Kotlin Bindings Build and Test"
    permissions:
      contents: read
    needs:
      - generate-matrix
      - build-libraries
    uses: ./.github/workflows/reusable-kotlin-build-and-test.yaml
    with:
      runner: ${{ inputs.runner }}
      rust-workspace: ${{ inputs.rust-workspace }}
      rust-cache: ${{ inputs.rust-cache }}

  java-bindings-build-and-test:
    name: "Java Bindings Build and Test"
    permissions:
      contents: read
    needs:
      - generate-matrix
      - build-libraries
    uses: ./.github/workflows/reusable-java-build-and-test.yaml
    with:
      runner: ${{ inputs.runner }}
      rust-workspace: ${{ inputs.rust-workspace }}
      rust-cache: ${{ inputs.rust-cache }}
