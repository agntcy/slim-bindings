---
name: ci-release-slimrpc-compiler

on:
  push:
    tags:
      - 'protoc-slimrpc-plugin-v*'
  # Re-run the release for an existing tag with the workflow from the selected
  # branch. A re-run of a failed tag run uses the workflow file as it was at the
  # tag, so a fix to this file can only reach an existing release this way.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, sign and upload (e.g. protoc-slimrpc-plugin-v3.0.0)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ensure-release:
    name: ensure-slimrpc-compiler-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The tag comes from the push, or from the workflow_dispatch input. A
      # dispatched tag must already exist: `gh release create` below would
      # otherwise create it on the default branch.
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^protoc-slimrpc-plugin-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a slimrpc compiler release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG does not exist"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          # release-plz creates the GitHub release for this tag (git_release_enable
          # is not disabled in slimrpc-compiler/.release-plz.toml), so it normally
          # already exists by the time this runs. Only create it if missing, and
          # make it idempotent so re-runs don't fail with "release already exists".
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        # GH_REPO gives `gh` the repo context without needing a checkout
        # (this job intentionally has none).
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG"

  build-binaries:
    name: "${{ matrix.platform.target }}"
    needs:
      - ensure-release
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ./slimrpc-compiler
    strategy:
      # One broken platform should not cancel the others' uploads.
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-musl
            archive: linux-x86_64
          - runner: ubuntu-24.04
            os: linux
            target: aarch64-unknown-linux-musl
            archive: linux-arm64
          - runner: windows-latest
            os: windows
            target: x86_64-pc-windows-msvc
            archive: windows-x86_64
          - runner: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
            archive: windows-arm64
          - runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            archive: macos-x86_64
          - runner: macos-15
            os: macos
            target: aarch64-apple-darwin
            archive: macos-arm64
    steps:
      # Build the tagged sources, also when dispatched from another branch.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.ensure-release.outputs.tag }}
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          workspace: ./slimrpc-compiler

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: protoc-gen-slimrpc-python
          target: ${{ matrix.platform.target }}
          archive: protoc-gen-slimrpc-python-${{ matrix.platform.archive }}
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: ./slimrpc-compiler/Cargo.toml
          ref: refs/tags/${{ needs.ensure-release.outputs.tag }}

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: protoc-gen-slimrpc-go
          target: ${{ matrix.platform.target }}
          archive: protoc-gen-slimrpc-go-${{ matrix.platform.archive }}
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: ./slimrpc-compiler/Cargo.toml
          ref: refs/tags/${{ needs.ensure-release.outputs.tag }}

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: protoc-gen-slimrpc-csharp
          target: ${{ matrix.platform.target }}
          archive: protoc-gen-slimrpc-csharp-${{ matrix.platform.archive }}
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: ./slimrpc-compiler/Cargo.toml
          ref: refs/tags/${{ needs.ensure-release.outputs.tag }}

  # Sign every archive in one Linux job, as release-bindings.yaml does:
  # cosign-installer does not support the windows-11-arm runner, and the
  # upload action writes its archives to the workspace root, not the
  # slimrpc-compiler working directory, so per-platform signing found nothing.
  sign-release:
    name: Sign release archives
    needs:
      - ensure-release
      - build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Needed for keyless (OIDC-based) cosign signing.
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless-sign each uploaded archive and attach its Sigstore bundle as a
      # release asset, so consumers can verify with
      # `cosign verify-blob --bundle <archive>.sigstore.json ... <archive>`.
      - name: Sign and attach archive signatures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          mkdir -p archives
          cd archives
          gh release download "$RELEASE_TAG" \
            --pattern 'protoc-gen-slimrpc-*.tar.gz' \
            --pattern 'protoc-gen-slimrpc-*.zip'
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No archives found on release $RELEASE_TAG"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done
          gh release upload "$RELEASE_TAG" ./*.sigstore.json --clobber
          echo "Signed ${#archives[@]} archives"
