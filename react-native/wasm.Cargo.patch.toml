# ubrn 0.31.0-3 emits opt-level as the string "3", which newer Cargo versions
# reject. Use Cargo's valid string form for size optimization; keeping the TOML
# type as a string also allows ubrn's manifest merger to replace the value.
[dependencies]
wasm-bindgen = "=0.2.106"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"

[workspace]
resolver = "2"
