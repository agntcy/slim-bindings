# ubrn 0.31.0-3 emits opt-level as the string "3", which newer Cargo versions
# reject. Use Cargo's valid string form for size optimization; keeping the TOML
# type as a string also allows ubrn's manifest merger to replace the value.
[dependencies]
wasm-bindgen = "=0.2.106"

[profile.release]
opt-level = "z"

[patch.crates-io]
# Browser transport support currently lives in the adjacent SLIM checkout.
# This patch is merged into react-native/wasm/Cargo.toml, so these paths are
# relative to that generated manifest rather than this source patch file.
agntcy-slim-bindings = { path = "../../../slim/crates/slim-bindings" }
agntcy-slim-auth = { path = "../../../slim/crates/auth" }
agntcy-slim-config = { path = "../../../slim/crates/config" }
agntcy-slim-datapath = { path = "../../../slim/crates/datapath" }
agntcy-slim-session = { path = "../../../slim/crates/session" }

[workspace]
resolver = "2"
