---
version: "3"

silent: true
set: [pipefail]
shopt: [globstar]

verbose: false

includes:
  rust:
    taskfile: ../tasks/rust.yaml
    internal: true
    vars:
      PROFILE: '{{.PROFILE | default "release"}}'
  tools:
    taskfile: ../tasks/tools.yaml
    internal: true

env:
  SHARED_SECRET: "my_shared_secret_for_testing_purposes_only"

tasks:
  default:
    cmds:
      - task -l- -

  python:bindings:devdeps:
    internal: true
    cmds:
      - uv sync --group linting --group testing

  python:bindings:lint:
    desc: "Lint the Python bindings"
    deps:
      - python:bindings:devdeps
    aliases:
      - lint
    cmds:
      - uv sync --group linting
      - uv run ruff check
      - uv run ruff format --check
      - uv run mypy --ignore-missing-imports --explicit-package-bases .

  python:bindings:build:
    desc: "Build the Python bindings using Maturin"
    aliases:
      - generate
    vars:
      PROFILE: '{{.PROFILE | default "debug"}}'
      RELEASE:
        sh: '[[ {{.PROFILE}} == "release" ]] && echo "--release" || echo ""'
    cmds:
      - echo "Building Python bindings..."
      - uv sync
      - task: rust:run-command
        vars:
          COMMAND: |
            uv run maturin develop --uv {{.RELEASE}}
      - echo "Build complete"

  python:bindings:test:
    desc: "Test the Python bindings"
    aliases:
      - test
    deps:
      - python:bindings:build
    cmds:
      - task: python:bindings:devdeps
      - uv run pytest -s {{.TESTS}}
    vars:
      TARGET: '{{.TESTS | default ""}}'

  python:bindings:packaging:
    desc: "Generate Python wheels for multiple Python versions (3.10, 3.11, 3.12, 3.13, 3.14) using Maturin"
    deps:
      - tools:zig
    vars:
      INTERPRETERS: '{{.INTERPRETERS | default "3.10 3.11 3.12 3.13 3.14"}}'
    aliases:
      - build
    cmds:
      - |
        # Force aarch64 Python on Windows ARM64, as uv defaults to x86_64 even on ARM64
        if [[ "{{.TARGET_ARCH}}" = "aarch64" && "{{.TARGET_OS}}" = "windows" ]]; then
          uv python install "aarch64"
        else
          uv python install
        fi

        rustup target add {{.TARGET}}

        MATURIN_ARGS=(
          {{.RELEASE}}
          --out dist
          --target {{.TARGET}}
          --frozen
          --strip
          -i {{.INTERPRETERS}}
        )

        if [[ "{{.TARGET_ABI}}" = "gnu" ]]; then
          MATURIN_ARGS+=(
            --compatibility manylinux_2_28
            --zig
          )
        elif [[ "{{.TARGET_ABI}}" = "musl" ]]; then
          MATURIN_ARGS+=(
            --compatibility musllinux_1_2
            --zig
          )
        fi

        # maturin --zig compiles with the zig wrappers bundled in maturin, while the Build library
        # step uses the standalone cargo-zigbuild. The wrapper path (and so the -C linker flag and
        # the CC_* / CMAKE_TOOLCHAIN_FILE_* env) differs between the two, which makes cargo rebuild
        # the whole dependency tree whenever they share a target directory, and each build then
        # invalidates the other. Give maturin its own directory (inside rust/target, so the Rust
        # cache keeps it) and both builds stay fresh.
        if [[ "{{.TARGET_ABI}}" = "gnu" || "{{.TARGET_ABI}}" = "musl" ]]; then
          MATURIN_ARGS+=(--target-dir "{{.TASKFILE_DIR}}/../rust/target/wheels-zig")
        fi

        # uv must only install the build tools (maturin), never build this project. A plain
        # `uv run` / `uv sync` installs the project through its PEP 517 backend (maturin) first,
        # which is a silent extra full cargo build. `uv run` has no --no-install-project, so sync
        # the dependencies explicitly and run with --no-sync.
        uv sync --no-install-project --group building

        # On Linux (zig) builds, maturin build runs uniffi-bindgen on its own artifact and gets no
        # output (stripped or not), so slim_bindings.py and slim_rpc.py are missing from the wheel.
        # maturin packages whatever it finds in <target-dir>/maturin/uniffi/slim_bindings._slim_bindings,
        # and until the project stopped being installed through uv, that install populated this
        # directory as a side effect. Generate the modules there explicitly from the prebuilt
        # library, which uniffi-bindgen reads fine.
        if [[ "{{.TARGET_ABI}}" = "gnu" || "{{.TARGET_ABI}}" = "musl" ]]; then
          BINDINGS_DIR="{{.TASKFILE_DIR}}/../rust/target/wheels-zig/maturin/uniffi/slim_bindings._slim_bindings"
          LIB="{{.TASKFILE_DIR}}/../rust/target/{{.TARGET}}/{{.PROFILE | default "release"}}/libslim_bindings.so"
          if [ ! -f "$LIB" ]; then
            echo "error: prebuilt library $LIB not found" >&2
            exit 1
          fi
          rm -rf "$BINDINGS_DIR"
          (cd "{{.TASKFILE_DIR}}/../rust" && uv run --project "{{.TASKFILE_DIR}}" --no-sync \
            uniffi-bindgen generate --library "$LIB" --language python --out-dir "$BINDINGS_DIR")
        fi

        # Workaround for windows
        if [[ "{{.TARGET_OS}}" = "windows" ]]; then
          uv run --no-sync maturin develop --uv {{.RELEASE}}

          # This file is a leftover from the previous build, delete it otherwise
          # maturin will try to add it to the wheel, and it will fail
          rm -f slim_bindings/*.pyd
        fi

        echo "Running maturin with the following args: ${MATURIN_ARGS[@]}"

        PATH=${PATH}:{{.TOOLS_INSTALL_DIR}} \
        uv run                              \
          --no-sync                         \
          maturin build                     \
          ${MATURIN_ARGS[@]}

        # Fail the build if a wheel is missing the generated UniFFI modules.
        uv run --no-sync python - dist/slim_bindings-*.whl <<'PY'
        import sys, zipfile

        missing = []
        for wheel in sys.argv[1:]:
            names = zipfile.ZipFile(wheel).namelist()
            for module in ("slim_bindings.py", "slim_rpc.py"):
                if f"slim_bindings/_slim_bindings/{module}" not in names:
                    missing.append(f"{wheel}: {module}")
        if missing:
            sys.exit("error: generated modules missing from wheels:\n" + "\n".join(missing))
        PY

  python:bindings:test:wheel:
    desc: "Test wheel installation across Python versions 3.10-3.14"
    vars:
      WHEEL: '{{.WHEEL | default ""}}'
      VERSION:
        sh: grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/'
      INTERPRETERS: '{{.INTERPRETERS | default "3.10 3.11 3.12 3.13 3.14"}}'
    cmds:
      - |
        # Detect system and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        # Normalize architecture names
        case "$ARCH" in
          x86_64|amd64)
            ARCH="x86_64"
            ;;
          aarch64|arm64)
            ARCH="aarch64"
            ;;
          *)
            echo "Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

        # Determine wheel file based on OS
        if [ -n "{{.WHEEL}}" ]; then
          WHEEL_FILE="{{.WHEEL}}"
        else
          case "$OS" in
            linux)
              WHEEL_FILE="dist/slim_bindings-{{.VERSION}}-py3-none-manylinux_2_28_${ARCH}.whl"
              ;;
            darwin)
              # macOS universal2 wheel
              WHEEL_FILE="dist/slim_bindings-{{.VERSION}}-py3-none-macosx_11_0_${ARCH}.whl"
              # Fallback to universal2
              if [ ! -f "$WHEEL_FILE" ]; then
                WHEEL_FILE="dist/slim_bindings-{{.VERSION}}-py3-none-macosx_11_0_universal2.whl"
              fi
              ;;
            mingw*|msys*|cygwin*)
              WHEEL_FILE="dist/slim_bindings-{{.VERSION}}-py3-none-win_${ARCH}.whl"
              ;;
            *)
              echo "Unsupported OS: $OS"
              exit 1
              ;;
          esac
        fi

        echo "Detected system: $OS ($ARCH)"
        echo "Testing wheel installation: $WHEEL_FILE"
        echo "Python versions: {{.INTERPRETERS}}"
        echo ""

        if [ ! -f "$WHEEL_FILE" ]; then
          echo "Wheel file not found: $WHEEL_FILE"
          echo ""
          echo "Available wheels in dist/:"
          ls -1 dist/*.whl 2>/dev/null || echo "  (no wheels found)"
          exit 1
        fi

        uv python install {{.INTERPRETERS}}

        FAILED=0
        for py_version in {{.INTERPRETERS}}; do
          echo "Testing Python ${py_version}..."

          VENV_DIR=".test-venv-${py_version}"
          rm -rf "$VENV_DIR"

          if uv venv "$VENV_DIR" --python "${py_version}" 2>&1; then
            if uv pip install --python "$VENV_DIR" "$WHEEL_FILE" 2>&1; then
              if uv run --python "$VENV_DIR" python -c "import slim_bindings; slim_bindings.initialize_with_defaults(); print('  Module imported successfully')" 2>&1; then
                echo "  Python ${py_version}: Installation and import successful"
              else
                echo "  Python ${py_version}: Import failed"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "  Python ${py_version}: Installation failed"
              FAILED=$((FAILED + 1))
            fi
          else
            echo "  Python ${py_version}: Failed to create venv"
            FAILED=$((FAILED + 1))
          fi

          rm -rf "$VENV_DIR"
          echo ""
        done

        if [ $FAILED -eq 0 ]; then
          echo "All Python versions tested successfully!"
        else
          echo "$FAILED Python version(s) failed"
          exit 1
        fi

  python:bindings:clean:
    desc: Clean build artifacts
    aliases:
      - clean
    cmds:
      - echo "Cleaning build artifacts..."
      - uv pip uninstall -y slim-bindings 2>/dev/null || true
      - rm -rf ../rust/target/debug/libslim_bindings.so
      - rm -rf ../rust/target/debug/libslim_bindings.dylib
      - rm -rf ../rust/target/debug/libslim_bindings.dll
      - rm -rf ../rust/target/debug/deps/libslim_bindings.so
      - rm -rf ../rust/target/debug/deps/libslim_bindings.dylib
      - rm -rf ../rust/target/debug/deps/libslim_bindings.dll
      - rm -rf .venv/lib/python*/site-packages/slim_bindings/
      - rm -rf .venv/lib/python*/site-packages/slim_bindings-*.dist-info/
      - rm -rf dist/
      - rm -rf build/
      - rm -rf *.egg-info/
      - rm -rf .pytest_cache/
      - rm -rf __pycache__/
      - rm -rf slim_bindings/__pycache__/
      - rm -rf slim_bindings/*.so
      - rm -rf slim_bindings/*.dylib
      - rm -rf slim_bindings/*.dll
      - rm -rf slim_bindings/*.pyd
      - rm -rf examples/__pycache__/
      - rm -rf examples/*/__pycache__/
      - rm -rf tests/__pycache__/
      - echo "Clean complete"

  python:bindings:install-examples:
    desc: "Install slim-bindings with examples dependencies"
    cmds:
      - uv pip install 'slim-bindings[examples]'

  python:build:
    desc: "Build Python bindings and install example dependencies"
    cmds:
      - task: python:bindings:build
      - task: python:bindings:install-examples

  examples:server:
    desc: "Run the server example"
    deps:
      - python:build
    env:
      SLIM_INSTANCE_ID: server
    cmds:
      - uv run slim-bindings-server --slim "127.0.0.1:46357" {{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:p2p:alice:
    desc: "Point to Point example - Alice will listen for messages and echo them"
    deps:
      - python:build
    cmds:
      - |
        uv run slim-bindings-p2p                                                      \
          --local agntcy/ns/alice                                                     \
          --shared-secret $SHARED_SECRET {{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:p2p:no-mls:bob:
    desc: "Point to Point example - Bob will send unencrypted messages to Alice"
    deps:
      - python:build
    env:
      SLIM_INSTANCE_ID: bob
    cmds:
      - |
        uv run slim-bindings-p2p                                                      \
          --local agntcy/ns/bob                                                       \
          --shared-secret $SHARED_SECRET                                              \
          --remote agntcy/ns/alice                                                    \
          --message "hey there"                                                       \
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:p2p:mls:bob:
    desc: "Point to Point example - Bob will send encrypted messages to Alice"
    deps:
      - python:build
    env:
      SLIM_INSTANCE_ID: bob
    cmds:
      - |
        uv run slim-bindings-p2p                                                      \
          --local agntcy/ns/bob                                                       \
          --shared-secret $SHARED_SECRET                                              \
          --remote agntcy/ns/alice                                                    \
          --message "hey there"                                                       \
          --enable-mls                                                                \
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:group:moderator:
    desc: "group moderator example - Creates a channel, invites participants, and sends encrypted messages"
    deps:
      - python:build
    cmds:
      - |
        uv run slim-bindings-group                                                    \
          --local agntcy/ns/moderator                                                 \
          --shared-secret $SHARED_SECRET                                              \
          --remote agntcy/ns/chat                                                     \
          --invites agntcy/ns/client-1                                                \
          --invites agntcy/ns/client-2                                                \
          --enable-mls {{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:group:client-1:
    desc: "Group client example - Waits to be invited to a channel and receives encrypted messages"
    deps:
      - python:build
    cmds:
      - |
        uv run slim-bindings-group                                                    \
          --local agntcy/ns/client-1                                                  \
          --shared-secret $SHARED_SECRET{{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:group:client-2:
    desc: "Group client example - Waits to be invited to a channel and receives encrypted messages"
    deps:
      - python:build
    cmds:
      - |
        uv run slim-bindings-group                                                    \
          --local agntcy/ns/client-2                                                  \
          --shared-secret $SHARED_SECRET{{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:rpc:server:
    desc: "Run the SlimRPC server example"
    deps:
      - python:build
    cmds:
      - echo "Starting SlimRPC server..."
      - uv run slim-bindings-simple-rpc-server --instance {{.INSTANCE}} {{.EXTRA_ARGS}}
    vars:
      INSTANCE: '{{.INSTANCE | default "server"}}'
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  python:examples:rpc:client:
    desc: "Run the SlimRPC client example"
    deps:
      - python:build
    cmds:
      - echo "Starting SlimRPC client..."
      - uv run slim-bindings-simple-rpc-client {{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  examples:rpc:group-client:
    desc: "Run the SlimRPC group (multicast) client example"
    deps:
      - python:build
    cmds:
      - echo "Starting SlimRPC group client..."
      - uv run slim-bindings-simple-rpc-client-group {{.EXTRA_ARGS}}
    vars:
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'

  python:generate-proto:
    desc: "Generate proto files for the Python bindings"
    deps:
      - task: rust:run-command
        vars:
          COMMAND: |
            cargo install --locked --path "{{.TASKFILE_DIR}}/../slimrpc-compiler" --bin protoc-gen-slimrpc-python
      - task: tools:buf
    cmds:
      - |
        # Find all the buf.gen.yaml files in the current directory and its subdirectories
        find . -name 'buf.gen.yaml' | while read -r file; do
          # Generate the proto files using buf
          echo "Generating proto files for $file"
          # get folder name
          folder=$(dirname "$file")
          pushd > /dev/null ${folder} && {{.TOOLS_INSTALL_DIR}}/buf generate && popd > /dev/null
        done
