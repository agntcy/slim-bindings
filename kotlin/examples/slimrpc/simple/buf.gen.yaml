version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: com
inputs:
  - proto_file: example.proto
plugins:
  - remote: buf.build/protocolbuffers/java
    out: types
  - remote: buf.build/protocolbuffers/kotlin
    out: types
  # Requires `protoc-gen-slimrpc-kotlin` on PATH (built from the in-repo slimrpc-compiler by `task generate-proto`).
  - local: protoc-gen-slimrpc-kotlin
    out: slimrpc
