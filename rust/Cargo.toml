[package]
name = "agntcy-slim-bindings-ffi"
version = "2.0.0-alpha.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agntcy/slim-bindings"
description = "UniFFI bindings and FFI adapter for SLIM data plane - enables language integrations (Go, Swift, Kotlin, etc.)"

[lib]
name = "slim_bindings"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["rpc"]
web = ["slim-bindings-impl/web"]
rpc = ["dep:slim-rpc-impl"]

[dependencies]
slim-bindings-impl = { package = "agntcy-slim-bindings", version = "2.0.0-alpha.12", default-features = false }
slim-rpc-impl = { package = "agntcy-slim-rpc", version = "2.0.0-alpha.10", features = ["uniffi"], optional = true }
