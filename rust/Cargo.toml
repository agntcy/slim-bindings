[package]
name = "agntcy-slim-bindings-ffi"
version = "2.0.0-alpha.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agntcy/slim-bindings"
description = "UniFFI bindings and FFI adapter for SLIM data plane - enables language integrations (Go, Swift, Kotlin, etc.)"

[lib]
name = "slim_bindings"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = []
web = ["slim-bindings-impl/web"]

[dependencies]
slim-bindings-impl = { package = "agntcy-slim-bindings", path = "../../slim/crates/slim-bindings", version = "2.0.0-alpha.8", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slim-rpc-impl = { package = "agntcy-slim-rpc", version = "2.0.0-alpha.6", features = ["uniffi"] }
