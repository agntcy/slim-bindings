version: "3"

includes:
  rust:
    taskfile: ../tasks/rust.yaml
    internal: true
  tools:
    taskfile: ../tasks/tools.yaml
    internal: true
    flatten: true

env:
  PATH: "{{.TOOLS_INSTALL_DIR}}/zig:{{.PATH}}"

vars:
  GNU_CLIB_VERSION: 2.28
  # Default to release for bindings; overrides rust.yaml's default "debug" so vars propagate correctly
  # when called from node/react-native/etc. (nested includes can drop PROFILE propagation)
  PROFILE: '{{.PROFILE | default "release"}}'
  RELEASE:
    sh: '[[ {{.PROFILE}} == "release" ]] && echo "--release" || echo ""'
  BINDINGS_PACKAGE: agntcy-slim-bindings-ffi
  CURRENT_TARGET:
    sh: 'rustc -vV | sed -n "s|host: ||p"'
  TARGET: "{{.TARGET | default .CURRENT_TARGET}}"
  SHARED_SECRET: "a-very-long-shared-secret-abcdef1234567890"

tasks:
  default:
    cmds:
      - task -l

  bindings:install-cargo-components:
    desc: Install required cargo components
    status:
      - which cargo-zigbuild
    cmds:
      - echo "🦀 Installing required cargo components..."
      - cargo install cargo-zigbuild

  bindings:build:all:
    desc: Build the Rust library with UniFFI
    dir: "{{.TASKFILE_DIR}}"
    aliases:
      - build
      - generate
    deps:
      - task: zig
      - task: dlltool-wrapper
      - bindings:install-cargo-components
    silent: true
    cmds:
      - echo "🦀 Building Rust bindings library... {{.TARGET}}"
      - task: rust:crossbuild
        vars:
          ARGS: --config 'profile.release.strip="none"'
          TARGET: "{{.TARGET}}"
          PROFILE: "{{.PROFILE}}"
      # zigbuild always uses --target on Linux, so only target/<triple>/<profile>/ exists.
      # That artifact can lack UNIFFI_META* symbols (strip / linker); UniFFI Java bindgen needs them.
      # When building for the host, also produce target/<profile>/ via plain cargo build.
      - |
        set -eu
        HOST=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r' | xargs)
        TARGET=$(printf '%s' '{{.TARGET}}' | tr -d '\r' | xargs)
        if [[ "$TARGET" != "$HOST" ]]; then
          echo "🦀 Skip host-native cdylib (TARGET != host)."
          exit 0
        fi
        echo "🦀 Building host-native cdylib for UniFFI (cargo build, no --target)..."
        cd "{{.TASKFILE_DIR}}"
        PROFILE="{{.PROFILE}}"
        if [[ "$PROFILE" == "release" ]]; then
          cargo build --release --locked --all-features
        else
          cargo build --locked --all-features
        fi
      - echo "🦀 Rust bindings library built successfully."

  lint:
    desc: Run Rust format check and clippy for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets --locked --all-features -- -D warnings

  test:
    desc: Run the Rust tests for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    vars:
      RELEASE:
        sh: '[[ {{.PROFILE}} == "release" ]] && echo "--release" || echo ""'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - cargo test {{.RELEASE}} --locked --all-features --all-targets {{.ARGS}}

  clean:
    desc: Remove Cargo build artifacts for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo clean

