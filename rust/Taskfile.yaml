version: "3"

includes:
  rust:
    taskfile: ../tasks/rust.yaml
    internal: true
  tools:
    taskfile: ../tasks/tools.yaml
    internal: true
    flatten: true

env:
  PATH: "{{.TOOLS_INSTALL_DIR}}/zig:{{.PATH}}"

vars:
  GNU_CLIB_VERSION: 2.28
  # Default to release for bindings; overrides rust.yaml's default "debug" so vars propagate correctly
  # when called from node/react-native/etc. (nested includes can drop PROFILE propagation)
  PROFILE: '{{.PROFILE | default "release"}}'
  RELEASE:
    sh: '[[ {{.PROFILE}} == "release" ]] && echo "--release" || echo ""'
  BINDINGS_PACKAGE: agntcy-slim-bindings-ffi
  CURRENT_TARGET:
    sh: 'rustc -vV | sed -n "s|host: ||p"'
  TARGET: "{{.TARGET | default .CURRENT_TARGET}}"
  SHARED_SECRET: "a-very-long-shared-secret-abcdef1234567890"

tasks:
  default:
    cmds:
      - task -l

  bindings:install-cargo-components:
    desc: Install required cargo components
    status:
      - which cargo-zigbuild
    cmds:
      - echo "🦀 Installing required cargo components..."
      - cargo install cargo-zigbuild

  bindings:build:all:
    desc: Build the Rust library with UniFFI
    dir: "{{.TASKFILE_DIR}}"
    aliases:
      - build
      - generate
    deps:
      - task: zig
      - task: dlltool-wrapper
      - bindings:install-cargo-components
    silent: true
    cmds:
      - echo "🦀 Building Rust bindings library... {{.TARGET}}"
      - task: rust:crossbuild
        vars:
          ARGS: --config 'profile.release.strip="none"'
          TARGET: "{{.TARGET}}"
          PROFILE: "{{.PROFILE}}"
      - echo "🦀 Rust bindings library built successfully."

  bindings:ensure:
    desc: "Make the cdylib available: check for a prebuilt one in CI, build it otherwise (override with REBUILD=true|false)"
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    vars:
      # true  -> always build (e.g. dev loop, or CI job that must compile)
      # false -> only check for the prebuilt library
      # unset -> false when CI is set, true otherwise
      REBUILD: '{{.REBUILD | default ""}}'
    cmds:
      # CLI invocation so TARGET/PROFILE propagate through nested includes.
      - |
        rebuild="{{.REBUILD}}"
        if [ -z "$rebuild" ]; then
          if [ -n "${CI:-}" ]; then rebuild=false; else rebuild=true; fi
        fi
        if [ "$rebuild" = "true" ]; then
          task bindings:build:all TARGET="{{.TARGET}}" PROFILE="{{.PROFILE}}"
        else
          task bindings:check-lib TARGET="{{.TARGET}}" PROFILE="{{.PROFILE}}"
        fi

  bindings:check-lib:
    desc: Fail unless the prebuilt cdylib for TARGET/PROFILE exists (CI artifact restore check)
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        set -eu
        TARGET="{{.TARGET}}"
        case "$TARGET" in
          *-apple-*) lib="libslim_bindings.dylib" ;;
          *-windows-*) lib="slim_bindings.dll" ;;
          *) lib="libslim_bindings.so" ;;
        esac
        path="target/$TARGET/{{.PROFILE}}/$lib"
        if [ ! -f "$path" ]; then
          echo "error: prebuilt library $path not found." >&2
          echo "CI must restore the bindings-$TARGET artifact before this step; refusing to rebuild." >&2
          exit 1
        fi
        echo "✅ Using prebuilt library: $path"

  lint:
    desc: Run Rust format check and clippy for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets --locked -- -D warnings

  test:
    desc: Run the Rust tests for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    vars:
      RELEASE:
        sh: '[[ {{.PROFILE}} == "release" ]] && echo "--release" || echo ""'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - cargo test {{.RELEASE}} --locked --all-targets {{.ARGS}}

  clean:
    desc: Remove Cargo build artifacts for the bindings crate
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cargo clean

