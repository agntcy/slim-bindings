[workspace]
# Release any unpublished version found in Cargo.toml, not just versions
# prepared by a release-plz PR. With `false`, release-plz only releases when a
# branch named `release-plz-bindings-*` is merged, so a version bumped by hand
# in a regular PR is silently skipped: the release job still reports success
# but returns `{"releases":[]}`, publishing nothing and creating no tag. Since
# main's version normally matches the published one, a release only fires here
# when someone deliberately bumps it -- which is exactly when we want it.
release_always = true
release = false
# Distinct PR branch/name so this crate's release PR does not collide with
# the slimrpc-compiler release-plz instance (they'd otherwise share the
# default `release-plz-` branch and clobber each other's PR).
pr_branch_prefix = "release-plz-bindings-"
pr_name = "chore: release bindings crate v{{ version }}"

# release-plz's default PR body (as of 0.3.169) plus the bot's sign-off. The
# merge queue builds the release commit from the PR body, and the DCO app
# checks it; release-plz can't sign off its own commits.
pr_body = '''
{% set changes %}
{%- for release in releases %}
{%- if release.changelog %}{% if releases | length > 1 %}
## `{{ release.package }}`
{% endif %}
<blockquote>

{% if release.title %}## {{ release.title }}
{% endif %}
{{ release.changelog }}
</blockquote>{% endif %}
{% endfor %}
{% endset %}

## 🤖 New release
{% for release in releases %}
* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (⚠ API breaking changes){% elif release.semver_check == "compatible" %} (✓ API compatible changes){% endif %}
{%- endfor %}
{%- for release in releases %}{% if release.breaking_changes %}

### ⚠ `{{ release.package }}` breaking changes

```text
{{ release.breaking_changes }}
```{% endif %}{% endfor %}
{% if changes %}
<details><summary><i><b>Changelog</b></i></summary><p>
{{ changes }}
</p></details>
{% endif %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).

Signed-off-by: Agntcy Build Bot <build@agntcy.io>
'''

# Remove agntcy- from git tag and release names so they look like:
#   slim-bindings-v1.4.1
git_tag_name = "{{ package | replace(from='agntcy-', to='') }}-v{{ version }}"
git_release_name = "{{ package | replace(from='agntcy-', to='') }} v{{ version }}"

[[package]]
name = "agntcy-slim-bindings-ffi"
# Publish to crates.io under the renamed name so it does NOT collide with
# `agntcy-slim-bindings`, which is published from the slim repo.
publish = true
# release-plz owns the version bump, changelog, git tag, and crates.io
# publish. The tag also triggers release-bindings.yaml to build & publish
# the per-language artifacts at the same version (unified release).
release = true
changelog_update = true
# release-bindings.yaml (softprops) owns the GitHub release + artifacts, so
# don't let release-plz create a competing GitHub release for the same tag.
git_release_enable = false
# Keep the release tag as `slim-bindings-v*` (NOT `slim-bindings-ffi-v*`)
# despite the crate rename: one tag drives both the crate publish and the
# language publish pipelines, which derive each package's version by
# stripping the `slim-bindings-` prefix from the tag (release-bindings.yaml,
# reusable-*-release.yaml). A `slim-bindings-ffi-v*` tag would yield broken
# versions like `ffi-v2.0.0` for npm/PyPI/NuGet/Go/Maven.
git_tag_name = "slim-bindings-v{{ version }}"
